<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f6fa" />
  <title>Daylist — Todo App</title>
  <style>
    :root{--ink:#202333;--muted:#85899a;--line:#eceef3;--purple:#6857e8;--purple2:#f0edff;--bg:#f5f6fa;--white:#fff;--green:#20a779;--red:#e35d6a;--shadow:0 16px 45px rgba(37,38,65,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a79cf5;outline-offset:2px}.app{max-width:1120px;margin:0 auto;padding:34px 26px 54px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:800;letter-spacing:-.7px}.logo{width:37px;height:37px;border-radius:12px;background:var(--purple);display:grid;place-items:center;color:white;box-shadow:0 7px 16px #6857e84a}.logo svg{width:21px}.today{color:var(--muted);font-size:13px}
    .hero{display:flex;justify-content:space-between;align-items:end;margin:0 0 25px;gap:18px}.eyebrow{color:var(--purple);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.7px}.hero h1{font-size:clamp(27px,4vw,37px);letter-spacing:-1.5px;margin:5px 0 3px}.hero p{margin:0;color:var(--muted)}.progress-card{background:white;border:1px solid var(--line);border-radius:15px;padding:13px 16px;min-width:185px;box-shadow:0 5px 18px #292b4210}.progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:9px}.progress-top strong{color:var(--ink)}.track{height:6px;background:#eeeef5;border-radius:9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#6857e8,#a38afa);border-radius:9px;transition:width .25s}
    .layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}.sidebar,.main{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.sidebar{padding:19px 14px}.side-label{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#a0a3b1;padding:4px 11px 10px;text-transform:uppercase}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border:0;background:transparent;color:#74788a;text-align:left;border-radius:10px;margin:2px 0;font-size:13px}.nav:hover{background:#f8f7ff}.nav.active{background:var(--purple2);color:var(--purple);font-weight:700}.nav .count{margin-left:auto;font-size:11px;color:#9a9cad}.nav.active .count{color:var(--purple)}.nav svg{width:17px;height:17px;opacity:.8}.side-bottom{border-top:1px solid var(--line);margin-top:20px;padding:17px 10px 2px;color:var(--muted);font-size:12px}.side-bottom strong{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
    .main{padding:22px 23px;min-height:530px}.main-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.main-head h2{font-size:18px;margin:0;letter-spacing:-.4px}.task-total{font-size:12px;color:var(--muted);margin-top:3px}.add-btn{border:0;background:var(--purple);color:white;padding:10px 15px;border-radius:10px;font-weight:700;font-size:12px;box-shadow:0 6px 14px #6857e833}.add-btn:hover{background:#5544d3;transform:translateY(-1px)}
    .toolbar{display:flex;gap:10px;margin-bottom:17px}.search{position:relative;flex:1}.search svg{position:absolute;left:12px;top:11px;width:16px;color:#a0a3b1}.search input{width:100%;height:39px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 36px;outline:0;background:#fcfcfe;font-size:12px}.search input:focus,.field input:focus,.field select:focus{border-color:#a79cf5;box-shadow:0 0 0 3px #6857e817}.sort{border:1px solid var(--line);border-radius:9px;background:white;padding:0 11px;color:#74788a;font-size:12px;outline:0}
    .task-list{display:flex;flex-direction:column;gap:9px}.task{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid #eff0f5;border-radius:12px;transition:.18s;background:#fff}.task:hover{border-color:#dcd8fa;box-shadow:0 5px 14px #292b4208}.check{width:19px;height:19px;flex:none;border:1.6px solid #c9cbd6;border-radius:6px;background:white;display:grid;place-items:center;padding:0;color:white}.check svg{width:12px;display:none}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .check svg{display:block}.task-body{flex:1;min-width:0}.task-title{font-size:13px;font-weight:650;overflow-wrap:anywhere}.task-note{font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:#a3a6b2}.task-meta{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}.priority{font-size:10px;border-radius:6px;padding:4px 7px;font-weight:700}.priority.High{background:#fff0f0;color:#d45c65}.priority.Medium{background:#fff6e8;color:#c18a31}.priority.Low{background:#eaf8f2;color:#29956e}.due{font-size:10px;color:#999cac;white-space:nowrap}.due.overdue{color:var(--red);font-weight:700}.actions{display:flex;gap:3px;opacity:0;transition:.15s}.task:hover .actions,.task:focus-within .actions{opacity:1}.icon-btn{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:#999cac;display:grid;place-items:center}.icon-btn:hover{background:#f2f1ff;color:var(--purple)}.icon-btn.delete:hover{background:#fff0f0;color:var(--red)}.icon-btn svg{width:15px}
    .empty{padding:60px 15px;text-align:center;color:var(--muted)}.empty-icon{width:55px;height:55px;border-radius:18px;background:#f3f1ff;color:var(--purple);display:grid;place-items:center;margin:0 auto 13px}.empty-icon svg{width:25px}.empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.empty span{font-size:12px}
    .modal-backdrop{position:fixed;inset:0;background:#1c1d2d70;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.show{display:flex}.modal{width:min(440px,100%);background:white;border-radius:18px;padding:23px;box-shadow:0 25px 80px #17172c40}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal h3{margin:0;font-size:19px}.close{border:0;background:#f4f4f8;border-radius:8px;width:30px;height:30px;font-size:18px;color:#777}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:700;color:#6f7384;margin-bottom:6px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;outline:0;font-size:12px;background:white}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.cancel{background:white;border:1px solid var(--line);border-radius:9px;padding:9px 14px;color:#777;font-size:12px}.save{background:var(--purple);color:white;border:0;border-radius:9px;padding:9px 17px;font-size:12px;font-weight:700}
    .toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#242538;color:white;padding:10px 15px;border-radius:9px;font-size:12px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:720px){.app{padding:22px 14px 35px}.today{display:none}.hero{align-items:start;flex-direction:column}.progress-card{width:100%}.layout{grid-template-columns:1fr;gap:13px}.sidebar{padding:10px;display:flex;gap:5px;overflow-x:auto}.side-label,.side-bottom{display:none}.nav{white-space:nowrap;width:auto;flex:none;padding:9px 11px}.main{padding:17px 13px;min-height:460px}.task{gap:9px;padding:11px 9px}.task-meta{gap:5px}.due{display:none}.actions{opacity:1}.toolbar{gap:7px}.sort{max-width:112px}.main-head h2{font-size:16px}}
    @media(max-width:390px){.priority{display:none}.task-title{font-size:12px}.form-row{grid-template-columns:1fr}}

    /* Mobile-first refinement and responsive interaction polish */
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body { min-width: 320px; }
    button, input, select { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #a79cf5; outline-offset: 2px;
    }
    .app { width: min(100%, 1160px); }
    .sidebar { min-width: 0; }
    .main { min-width: 0; }
    .task { min-width: 0; }
    .task-body { overflow-wrap: anywhere; }
    .task-title, .task-note { word-break: break-word; }
    .nav { min-height: 42px; }
    .add-btn, .save, .cancel, .close, .icon-btn, .check { min-height: 40px; }
    .icon-btn { min-width: 40px; }
    .check { min-width: 22px; min-height: 22px; }
    .search input, .sort, .field input, .field select { min-height: 44px; }
    .modal-backdrop { overflow-y: auto; }
    .modal { max-height: calc(100dvh - 36px); overflow-y: auto; }
    .empty { padding-inline: 12px; }
    @media (max-width: 720px) {
      .app { padding: 20px 14px calc(28px + env(safe-area-inset-bottom)); }
      header { margin-bottom: 24px; }
      .hero { gap: 15px; margin-bottom: 18px; }
      .hero p { max-width: 38ch; font-size: 13px; }
      .progress-card { min-width: 0; }
      .layout { display: flex; flex-direction: column; }
      .sidebar {
        width: 100%; overflow-x: auto; overscroll-behavior-x: contain;
        scrollbar-width: none; padding: 8px; gap: 4px;
        position: relative; top: auto;
      }
      .sidebar::-webkit-scrollbar { display: none; }
      .nav { min-height: 42px; padding: 8px 12px; }
      .main { width: 100%; padding: 17px 14px; }
      .main-head { align-items: center; }
      .task { gap: 9px; }
      .actions { opacity: 1; }
      .icon-btn { min-width: 36px; min-height: 36px; }
      .modal-backdrop { align-items: flex-end; padding: 10px 10px env(safe-area-inset-bottom); }
      .modal {
        width: 100%; max-width: 560px; margin: 0 auto;
        border-radius: 20px 20px 14px 14px; padding: 20px;
        max-height: min(88dvh, 680px);
      }
      .toast { bottom: calc(14px + env(safe-area-inset-bottom)); max-width: calc(100vw - 28px); text-align: center; }
    }
    @media (max-width: 520px) {
      .brand { font-size: 19px; }
      .logo { width: 35px; height: 35px; }
      .hero h1 { font-size: clamp(26px, 8vw, 34px); }
      .main-head { align-items: flex-start; }
      .main-head h2 { font-size: 16px; }
      .add-btn { flex: none; padding: 9px 11px; min-height: 42px; }
      .toolbar { align-items: stretch; }
      .search { min-width: 0; }
      .sort { width: 118px; flex: none; }
      .task {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) auto;
        align-items: start; gap: 7px 9px; padding: 12px 10px;
      }
      .check { grid-column: 1; grid-row: 1 / span 2; margin-top: 1px; }
      .task-body { grid-column: 2; grid-row: 1; }
      .task-meta {
        grid-column: 2; grid-row: 2; margin: 1px 0 0;
        flex-wrap: wrap; justify-content: flex-start;
      }
      .priority { display: inline-flex; }
      .due { display: inline; }
      .actions {
        grid-column: 3; grid-row: 1 / span 2;
        align-self: center; gap: 1px;
      }
      .icon-btn { width: 34px; min-width: 34px; }
      .task-title { font-size: 13px; }
      .task-note { font-size: 11px; }
      .form-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 380px) {
      .app { padding-inline: 10px; }
      .main { padding: 14px 10px; }
      .main-head { flex-wrap: wrap; }
      .add-btn { width: 100%; }
      .toolbar { flex-direction: column; }
      .sort { width: 100%; }
      .task { grid-template-columns: 22px minmax(0, 1fr) auto; gap: 7px; }
      .actions { flex-direction: column; }
      .icon-btn { width: 32px; min-width: 32px; min-height: 32px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .modal { padding: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div>daylist</div>
      <div class="today" id="todayLabel"></div>
    </header>
    <section class="hero">
      <div><div class="eyebrow">Your personal workspace</div><h1>Make today count.</h1><p>A little progress each day adds up to big results.</p></div>
      <div class="progress-card"><div class="progress-top"><span>Daily progress</span><strong id="progressText">0%</strong></div><div class="track"><div class="fill" id="progressFill"></div></div></div>
    </section>
    <div class="layout">
      <aside class="sidebar">
        <div class="side-label">Workspace</div>
        <button class="nav active" data-filter="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>All tasks <span class="count" id="countAll">0</span></button>
        <button class="nav" data-filter="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today <span class="count" id="countToday">0</span></button>
        <button class="nav" data-filter="upcoming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>Upcoming <span class="count" id="countUpcoming">0</span></button>
        <button class="nav" data-filter="completed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>Completed <span class="count" id="countCompleted">0</span></button>
        <div class="side-bottom"><strong>Stay focused ✨</strong>One task at a time. You've got this.</div>
      </aside>
      <main class="main">
        <div class="main-head"><div><h2 id="sectionTitle">All tasks</h2><div class="task-total" id="taskTotal">Your tasks, all in one place</div></div><button class="add-btn" id="addTaskBtn">＋ Add task</button></div>
        <div class="toolbar"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" type="search" placeholder="Search your tasks..." aria-label="Search tasks"></div><select class="sort" id="sortSelect" aria-label="Sort tasks"><option value="created">Recently added</option><option value="due">Due date</option><option value="priority">Priority</option></select></div>
        <div class="task-list" id="taskList" aria-live="polite" aria-relevant="additions removals text"></div>
      </main>
    </div>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="taskForm"><div class="modal-head"><h3 id="modalTitle">Add a task</h3><button type="button" class="close" id="closeModal" aria-label="Close">×</button></div>
      <div class="field"><label for="taskTitle">Task name *</label><input id="taskTitle" maxlength="100" required placeholder="e.g. Finish project presentation"></div>
      <div class="field"><label for="taskNote">Description (optional)</label><input id="taskNote" maxlength="180" placeholder="Add a few details..."></div>
      <div class="form-row"><div class="field"><label for="taskDue">Due date</label><input type="date" id="taskDue"></div><div class="field"><label for="taskPriority">Priority</label><select id="taskPriority"><option>Low</option><option selected>Medium</option><option>High</option></select></div></div>
      <div class="modal-actions"><button type="button" class="cancel" id="cancelModal">Cancel</button><button class="save" type="submit">Save task</button></div>
    </form>
  </div>
  <div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const STORAGE_KEY = 'daylist.tasks.v1';
  const isValidDate = value => /^\\d{4}-\\d{2}-\\d{2}$/.test(value || '') && !Number.isNaN(new Date(value + 'T00:00:00').getTime());
  const makeId = () => (window.crypto && typeof window.crypto.randomUUID === 'function')
    ? window.crypto.randomUUID()
    : `task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
  let tasks = [];
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (Array.isArray(stored)) {
      tasks = stored.filter(t => t && typeof t === 'object').map((t, index) => ({
        id: String(t.id || `legacy-${index}-${Date.now()}`),
        title: String(t.title || '').slice(0, 100),
        note: String(t.note || '').slice(0, 180),
        due: isValidDate(t.due) ? t.due : '',
        priority: ['High', 'Medium', 'Low'].includes(t.priority) ? t.priority : 'Medium',
        done: Boolean(t.done),
        created: Number.isFinite(Number(t.created)) ? Number(t.created) : Date.now() + index
      })).filter(t => t.title.trim());
    }
  } catch { tasks = []; }
  let currentFilter = 'all', editingId = null, toastTimer;
  // Use the device's local calendar date, not UTC (which can be a different day).
  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const dateLabel = date => isValidDate(date)
    ? new Date(date + 'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})
    : '';
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const save = () => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      return true;
    } catch (error) {
      console.warn('Daylist could not save tasks in this browser:', error);
      toast('Could not save changes. Check browser storage.');
      return false;
    }
  };
  const icon = name => name === 'edit' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16z"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg>';
  function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2100)}
  function counts(){const active=tasks.filter(t=>!t.done);$('countAll').textContent=tasks.length;$('countToday').textContent=active.filter(t=>t.due===today()).length;$('countUpcoming').textContent=active.filter(t=>t.due&&t.due>today()).length;$('countCompleted').textContent=tasks.filter(t=>t.done).length;const done=tasks.filter(t=>t.done).length;const pct=tasks.length?Math.round(done/tasks.length*100):0;$('progressText').textContent=pct+'%';$('progressFill').style.width=pct+'%'}
  function visibleTasks(){let list=[...tasks],q=$('searchInput').value.trim().toLowerCase();if(currentFilter==='today')list=list.filter(t=>!t.done&&t.due===today());if(currentFilter==='upcoming')list=list.filter(t=>!t.done&&t.due&&t.due>today());if(currentFilter==='completed')list=list.filter(t=>t.done);if(q)list=list.filter(t=>(t.title+' '+t.note).toLowerCase().includes(q));const sort=$('sortSelect').value;if(sort==='due')list.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));else if(sort==='priority'){const p={High:0,Medium:1,Low:2};list.sort((a,b)=>(p[a.priority] ?? 1)-(p[b.priority] ?? 1))}else list.sort((a,b)=>(Number(b.created)||0)-(Number(a.created)||0));return list}
  function render(){counts();const titles={all:'All tasks',today:'Today',upcoming:'Upcoming',completed:'Completed'};$('sectionTitle').textContent=titles[currentFilter];const list=visibleTasks();$('taskTotal').textContent=`${list.length} ${list.length===1?'task':'tasks'} ${currentFilter==='all'?'in your workspace':'shown'}`;const host=$('taskList');if(!list.length){const isSearch=$('searchInput').value.trim();host.innerHTML=`<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></div><strong>${isSearch?'No matching tasks':'Nothing here yet'}</strong><span>${isSearch?'Try another search term.':'Add a task and make your day more productive.'}</span></div>`;return}host.innerHTML=list.map(t=>{const overdue=isValidDate(t.due)&&!t.done&&t.due<today();return `<article class="task ${t.done?'done':''}" data-id="${escapeHtml(t.id)}"><button class="check" data-action="toggle" aria-label="${t.done?'Mark as active':'Mark as completed'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 4 4L19 6"/></svg></button><div class="task-body"><div class="task-title">${escapeHtml(t.title)}</div>${t.note?`<div class="task-note">${escapeHtml(t.note)}</div>`:''}</div><div class="task-meta"><span class="priority ${t.priority}">${t.priority}</span>${t.due?`<span class="due ${overdue?'overdue':''}">${overdue?'Overdue · ':''}${dateLabel(t.due)}</span>`:''}</div><div class="actions"><button class="icon-btn" data-action="edit" aria-label="Edit task">${icon('edit')}</button><button class="icon-btn delete" data-action="delete" aria-label="Delete task">${icon('delete')}</button></div></article>`}).join('')}
  function openModal(task){editingId=task?.id??null;$('modalTitle').textContent=task?'Edit task':'Add a task';$('taskTitle').value=task?.title||'';$('taskNote').value=task?.note||'';$('taskDue').value=task?.due||'';$('taskPriority').value=task?.priority||'Medium';$('modalBackdrop').classList.add('show');setTimeout(()=>$('taskTitle').focus(),50)}
  function closeModal(){$('modalBackdrop').classList.remove('show');$('taskForm').reset();editingId=null}
  $('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=$('taskTitle').value.trim();if(!title)return;const data={title,note:$('taskNote').value.trim(),due:$('taskDue').value,priority:$('taskPriority').value};if(editingId){tasks=tasks.map(t=>t.id===editingId?{...t,...data}:t);toast('Task updated')}else{tasks.push({id:makeId(),...data,done:false,created:Date.now()});toast('Task added')}save();closeModal();render()});
  $('taskList').addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const card=btn.closest('[data-id]'),id=card.dataset.id,action=btn.dataset.action,task=tasks.find(t=>t.id===id);if(!task)return;if(action==='toggle'){task.done=!task.done;toast(task.done?'Task completed 🎉':'Task reopened')}if(action==='edit')openModal(task);if(action==='delete'){tasks=tasks.filter(t=>t.id!==id);toast('Task deleted')}save();render()});
  document.querySelectorAll('.nav').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===btn));render()}));
  $('addTaskBtn').addEventListener('click',()=>openModal());$('closeModal').addEventListener('click',closeModal);$('cancelModal').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('searchInput').addEventListener('input',render);$('sortSelect').addEventListener('change',render);
  $('todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});render();
})();
</script>
</body>
</html>
